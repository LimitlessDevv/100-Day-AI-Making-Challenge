<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Network Path Visualization</title>
    <style>
        :root {
            --surface: #E5E7EB;
            --surface-border: #D1D5DB;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --accent: #0078D4;
            --error: #D13438;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #E5E7EB;
                --surface-border: #D1D5DB;
                --text-primary: #1F2937;
                --text-secondary: #6B7280;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--surface);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            transition: background 0.2s, color 0.2s;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--surface-border);
            border-radius: 8px;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="file"] {
            padding: 8px 12px;
            border: 1px solid var(--text-secondary);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
        }

        button {
            padding: 8px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #106EBE;
        }

        .canvas-wrapper {
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            background: var(--surface);
            padding: 24px;
            margin-bottom: 24px;
            min-height: 300px;
        }

        .routing-info {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            background: var(--surface-border);
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .routing-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: var(--accent);
            color: white;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .routing-type-vnet {
            background: #50E6FF;
            color: #000;
        }

        .routing-type-peering {
            background: #8764B8;
            color: white;
        }

        .routing-type-firewall {
            background: #F25022;
            color: white;
        }

        .routing-type-internet {
            background: #FFB900;
            color: #000;
        }

        .routing-description {
            color: var(--text-secondary);
            font-size: 12px;
            flex: 1;
        }

        .path-visualization {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            overflow-x: auto;
            padding: 20px 0;
        }

        .path-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            padding-top: 0;
        }

        .node-icon {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            background-size: 70%;
            background-repeat: no-repeat;
            background-position: center;
        }

        .node-icon img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .node-vm { background: #E5E7EB; color: #000; }
        .node-nic { background: #E5E7EB; color: #000; }
        .node-subnet { background: #E5E7EB; color: #000; }
        .node-nsg { background: #E5E7EB; color: #000; }
        .node-vnet { background: #E5E7EB; color: #000; }
        .node-route { background: #E5E7EB; color: #000; }
        .node-next-hop { background: #E5E7EB; color: #000; }
        .node-destination { background: #E5E7EB; color: #000; }

        .node-label {
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            max-width: 90px;
            word-break: break-word;
            color: var(--text-primary);
        }

        .node-type {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            max-width: 90px;
        }

        .node-ip {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
            max-width: 90px;
            font-family: 'Monaco', 'Menlo', monospace;
            margin-top: 2px;
        }

        .node-status {
            font-size: 8px;
            margin-top: 4px;
            padding: 2px 4px;
            border-radius: 3px;
            text-align: center;
            font-weight: 600;
        }

        .node-status.allowed {
            background: rgba(16, 124, 16, 0.3);
            color: #107C10;
        }

        .node-status.denied {
            background: rgba(209, 52, 56, 0.3);
            color: #D13438;
        }

        .arrow {
            font-size: 24px;
            color: var(--accent);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            padding-top: 0;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .info-card {
            padding: 16px;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            background: var(--surface);
        }

        .info-card h3 {
            margin: 0 0 12px 0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .info-value {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: var(--text-primary);
            word-break: break-all;
            line-height: 1.5;
        }

        .path-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .path-table th {
            background: var(--surface-border);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .path-table td {
            padding: 12px;
            border-bottom: 1px solid var(--surface-border);
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }

        .path-table tr:hover {
            background: var(--surface-border);
        }

        .error {
            color: var(--error);
            padding: 16px;
            background: rgba(209, 52, 56, 0.1);
            border-radius: 4px;
            border-left: 4px solid var(--error);
        }

        .success {
            color: #107C10;
            padding: 16px;
            background: rgba(16, 124, 16, 0.1);
            border-radius: 4px;
            border-left: 4px solid #107C10;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--surface-border);
            background: var(--surface);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            z-index: 100;
        }

        .theme-toggle:hover {
            background: var(--surface-border);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 120, 212, 0.3);
            border-radius: 50%;
            border-top-color: #0078D4;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .path-visualization {
                flex-direction: column;
                gap: 12px;
            }

            .arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Azure Network Path Visualization</h1>
            <p class="subtitle">Visualize network traffic path from source to destination</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="resourceGroup">Resource Group</label>
                <input type="text" id="resourceGroup" placeholder="e.g., inyoung">
            </div>
            <div class="control-group">
                <label for="vmName">VM Name</label>
                <input type="text" id="vmName" placeholder="e.g., kali-linux">
            </div>
            <div class="control-group">
                <label for="sourceIP">Source IP</label>
                <input type="text" id="sourceIP" placeholder="e.g., 10.0.0.4">
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="destIP">Destination IP</label>
                <input type="text" id="destIP" placeholder="e.g., 8.8.8.8">
            </div>
            <div class="control-group">
                <label for="destPort">Destination Port</label>
                <input type="text" id="destPort" placeholder="e.g., 22">
            </div>
            <div class="control-group">
                <label for="protocol">Protocol</label>
                <select id="protocol" style="padding: 8px 12px; border: 1px solid var(--text-secondary); border-radius: 4px; background: var(--surface); color: var(--text-primary);">
                    <option value="TCP">TCP</option>
                    <option value="UDP">UDP</option>
                </select>
            </div>
            <div class="control-group">
                <button id="traceBtn" style="background: #107C10;">▶ Trace</button>
            </div>
        </div>

        <div id="status"></div>

        <div class="canvas-wrapper">
            <div id="routingInfo"></div>
            <div id="visualization"></div>
        </div>

        <div class="info-panel" style="grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center;">
            <div class="info-card">
                <h3>Source</h3>
                <div class="info-value" id="info-source">N/A</div>
            </div>
            <div style="font-size: 24px; color: var(--accent); text-align: center; padding: 0 12px;">→</div>
            <div class="info-card">
                <h3>Destination</h3>
                <div class="info-value" id="info-dest">N/A</div>
            </div>
            <div style="font-size: 24px; color: var(--accent); text-align: center; padding: 0 12px;">|</div>
            <div class="info-card">
                <h3>Port & Protocol</h3>
                <div class="info-value" id="info-port">N/A</div>
            </div>
        </div>

        <div class="info-card">
            <h3>Full Network Path</h3>
            <table class="path-table" id="pathTable">
                <thead>
                    <tr>
                        <th>Step</th>
                        <th>Type</th>
                        <th>Name</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>

    <!-- Rules Modal -->
    <div id="rulesModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; padding: 24px; max-width: 600px; max-height: 80vh; overflow-y: auto; color: var(--text-primary);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 id="modalTitle" style="margin: 0; font-size: 18px;">Rules Details</h2>
                <button onclick="document.getElementById('rulesModal').style.display='none'" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-primary);">×</button>
            </div>
            <div id="modalContent" style="font-family: monospace; font-size: 12px; line-height: 1.6;"></div>
        </div>
    </div>

    <script>

        const typeIcons = {
            'Virtual Machine': './icons/virtual-machine.svg',
            'Network Interface': './icons/network-interfaces.svg',
            'Subnet': './icons/subnet.svg',
            'Network Security Group': './icons/network-security-groups.svg',
            'Virtual Network': './icons/virtual-networks.svg',
            'Route Table': './icons/route-tables.svg',
            'Effective Route': './icons/route-tables.svg',
            'Next Hop Result': './icons/firewalls.svg',
            'Destination': '🎯',
            'Azure Firewall': './icons/firewalls.svg',
            'Virtual Machine (Next Hop)': './icons/virtual-machine.svg',
            'Application Gateway': './icons/network-interfaces.svg'
        };

        const typeColors = {
            'Virtual Machine': 'node-vm',
            'Network Interface': 'node-nic',
            'Subnet': 'node-subnet',
            'Network Security Group': 'node-nsg',
            'Virtual Network': 'node-vnet',
            'Route Table': 'node-route',
            'Effective Route': 'node-route',
            'Next Hop Result': 'node-next-hop',
            'Destination': 'node-destination',
            'Azure Firewall': 'node-next-hop',
            'Virtual Machine (Next Hop)': 'node-next-hop',
            'Application Gateway': 'node-next-hop'
        };

        function showStatus(message, type = 'error', showSpinner = false) {
            const statusEl = document.getElementById('status');
            const spinnerHtml = showSpinner ? '<span class="loading-spinner"></span>' : '';
            statusEl.innerHTML = `<div class="${type}">${spinnerHtml}${message}</div>`;
            // 로딩 메시지는 자동으로 닫지 않음
            if (!showSpinner) {
                const timeout = type === 'success' && message.includes('코드') ? 30000 : 5000;
                setTimeout(() => { statusEl.innerHTML = ''; }, timeout);
            }
        }

        function showRulesModal(type, name, data) {
            const modal = document.getElementById('rulesModal');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');

            title.textContent = `${type} Rules - ${name}`;

            if (type === 'NSG') {
                let html = `<strong>NSG Validation Status:</strong><br>`;
                html += `Allowed: ${data.allowed ? '✅ YES' : '❌ NO'}<br>`;
                html += `Reason: ${data.reason}<br>`;
                html += `Matched Rule: <strong style="color: var(--accent);">${data.matchedRule}</strong><br><br>`;

                // Show matched rule details prominently
                if (data.matchedRuleDetails) {
                    html += `<div style="margin: 12px 0; padding: 12px; background: var(--accent); color: white; border-radius: 4px;">`;
                    html += `<strong>🎯 Applied Rule: ${data.matchedRuleDetails.name}</strong><br>`;
                    html += `Access: ${data.matchedRuleDetails.access} | Direction: ${data.matchedRuleDetails.direction}<br>`;
                    html += `Protocol: ${data.matchedRuleDetails.protocol}<br>`;
                    html += `Dest Ports: ${(data.matchedRuleDetails.destinationPortRanges && data.matchedRuleDetails.destinationPortRanges.length > 0) ? data.matchedRuleDetails.destinationPortRanges.join(', ') : '*'}<br>`;
                    html += `</div>`;
                }

                html += `<br><strong>All Rules:</strong><br>`;
                if (data.allRules && data.allRules.length > 0) {
                    data.allRules.forEach(rule => {
                        const isMatched = rule.name === data.matchedRule;
                        html += `<div style="margin: 8px 0; padding: 8px; background: ${isMatched ? 'rgba(0, 120, 212, 0.2)' : 'var(--surface-border)'}; border-radius: 4px; border-left: 3px solid ${isMatched ? 'var(--accent)' : 'transparent'};">`;
                        html += `${isMatched ? '✓ ' : ''}<strong>${rule.name}</strong><br>`;
                        html += `Access: ${rule.access} | Direction: ${rule.direction}<br>`;
                        html += `Protocol: ${rule.protocol}<br>`;
                        html += `Dest Ports: ${(rule.destinationPortRanges && rule.destinationPortRanges.length > 0) ? rule.destinationPortRanges.join(', ') : '*'}<br>`;
                        html += `</div>`;
                    });
                } else {
                    html += 'No rules found';
                }
                content.innerHTML = html;
            } else if (type === 'Firewall') {
                let html = `<strong>Firewall Status:</strong><br>`;
                html += `Name: ${data.name}<br>`;
                html += `IP: ${data.ip}<br>`;
                html += `SKU: ${data.sku}<br>`;
                html += `Rule Allowed: ${data.ruleAllowed ? '✅ YES' : '❌ NO'}<br>`;
                if (data.matchedRule) {
                    html += `Matched Rule: <strong style="color: var(--accent);">${data.matchedRule}</strong><br>`;
                }
                html += `<br><strong>Firewall Rules:</strong><br>`;
                if (data.rules && data.rules.length > 0) {
                    data.rules.forEach(rule => {
                        const isMatched = rule.name === data.matchedRule;
                        html += `<div style="margin: 8px 0; padding: 12px; background: ${isMatched ? 'rgba(0, 120, 212, 0.2)' : 'var(--surface-border)'}; border-radius: 4px; border-left: 3px solid ${isMatched ? 'var(--accent)' : 'transparent'};">`;
                        html += `${isMatched ? '✓ ' : ''}<strong>${rule.name}</strong><br>`;
                        html += `Type: ${rule.type} | Action: ${rule.action}<br>`;

                        // Safe array access with fallback
                        const sourceAddrs = Array.isArray(rule.sourceAddresses) ? rule.sourceAddresses : (rule.sourceAddresses ? [rule.sourceAddresses] : []);
                        const sourceIpGroups = Array.isArray(rule.sourceIpGroups) ? rule.sourceIpGroups : (rule.sourceIpGroups ? [rule.sourceIpGroups] : []);
                        const destAddrs = Array.isArray(rule.destinationAddresses) ? rule.destinationAddresses : (rule.destinationAddresses ? [rule.destinationAddresses] : []);
                        const destIpGroups = Array.isArray(rule.destinationIpGroups) ? rule.destinationIpGroups : (rule.destinationIpGroups ? [rule.destinationIpGroups] : []);
                        const fqdns = Array.isArray(rule.targetFqdns) ? rule.targetFqdns : (rule.targetFqdns ? [rule.targetFqdns] : []);
                        const ports = Array.isArray(rule.destinationPorts) ? rule.destinationPorts : (rule.destinationPorts ? [rule.destinationPorts] : []);
                        const protocols = Array.isArray(rule.protocols) ? rule.protocols : (rule.protocols ? [rule.protocols] : []);

                        if (sourceAddrs.length > 0) html += `Source: ${sourceAddrs.join(', ')}<br>`;
                        if (sourceIpGroups.length > 0) html += `Source IP Groups: ${sourceIpGroups.length} group(s)<br>`;
                        if (destAddrs.length > 0) html += `Dest: ${destAddrs.join(', ')}<br>`;
                        if (destIpGroups.length > 0) html += `Dest IP Groups: ${destIpGroups.length} group(s)<br>`;
                        if (fqdns.length > 0) html += `FQDNs: ${fqdns.join(', ')}<br>`;
                        if (ports.length > 0) html += `Ports: ${ports.join(', ')}<br>`;
                        if (protocols.length > 0) html += `Protocols: ${protocols.join(', ')}<br>`;
                        html += `</div>`;
                    });
                } else {
                    html += 'No rules found';
                }
                content.innerHTML = html;
            }

            modal.style.display = 'flex';
        }

        // Close modal on outside click
        document.getElementById('rulesModal').addEventListener('click', (e) => {
            if (e.target.id === 'rulesModal') {
                document.getElementById('rulesModal').style.display = 'none';
            }
        });

        function detectRoutingType(data, displayPath) {
            const meta = data.metadata || {};
            const path = data.path || [];
            const routingMethod = meta.routingMethod;

            // Look for VNet info in path
            const sourceVnetName = displayPath[displayPath.length - 2]?.name; // Usually VNet
            const destVnetName = displayPath[displayPath.length - 1]?.vnet;

            if (routingMethod === 'VirtualAppliance') {
                return {
                    type: 'firewall',
                    icon: '🔥',
                    label: 'Via Firewall',
                    description: `Traffic routed through Virtual Appliance before reaching destination`
                };
            } else if (routingMethod === 'VnetLocal') {
                // Check if it's peering or same VNet
                if (sourceVnetName && destVnetName && sourceVnetName !== destVnetName) {
                    return {
                        type: 'peering',
                        icon: '🔗',
                        label: 'VNet Peering',
                        description: `Direct communication between ${sourceVnetName} and ${destVnetName} via VNet peering`
                    };
                } else {
                    return {
                        type: 'vnet',
                        icon: '🌐',
                        label: 'Same VNet',
                        description: `Internal routing within the same Virtual Network`
                    };
                }
            } else if (routingMethod === 'Internet') {
                return {
                    type: 'internet',
                    icon: '🌍',
                    label: 'Internet Gateway',
                    description: `Traffic routed to external destination via Internet`
                };
            }

            return {
                type: 'vnet',
                icon: '🌐',
                label: 'Local VNet Delivery',
                description: 'Direct delivery within the same Virtual Network'
            };
        }

        function renderRoutingInfo(data, displayPath) {
            const infoEl = document.getElementById('routingInfo');
            const routing = detectRoutingType(data, displayPath);

            infoEl.innerHTML = `
                <div class="routing-info">
                    <div class="routing-badge routing-type-${routing.type}">
                        ${routing.icon} ${routing.label}
                    </div>
                    <div class="routing-description">${routing.description}</div>
                </div>
            `;
        }

        function renderVisualization(data) {
            const path = data.path || [];
            const vizEl = document.getElementById('visualization');
            const meta = data.metadata || {};

            if (path.length === 0) {
                vizEl.innerHTML = '<div class="error">No path data available</div>';
                return;
            }

            // Filter out "Next Hop Result" and "NSG Validation" type nodes
            let displayPath = path.filter(node => node.type !== 'Next Hop Result' && node.type !== 'NSG Validation');

            if (displayPath.length === 0) {
                vizEl.innerHTML = '<div class="error">No path data available</div>';
                return;
            }

            // Ensure Destination is at the end
            const lastNode = displayPath[displayPath.length - 1];
            if (!lastNode || lastNode.type !== 'Destination') {
                displayPath.push({
                    step: displayPath.length + 1,
                    type: 'Destination',
                    name: meta.destinationIp || 'Destination',
                    ip: meta.destinationIp,
                    port: meta.destinationPort,
                    protocol: meta.protocol
                });
            } else {
                // Update Destination with full info
                lastNode.name = meta.destinationIp || 'Destination';
                lastNode.ip = meta.destinationIp;
                lastNode.port = meta.destinationPort;
                lastNode.protocol = meta.protocol;
            }

            let html = '<div class="path-visualization">';

            displayPath.forEach((node, idx) => {
                const displayName = node.name || 'N/A';
                const displayIp = node.ip || '';
                let statusHtml = '';
                let clickable = '';

                // Show NSG validation status
                if (node.type === 'Network Security Group' && node.validation) {
                    const status = node.validation.allowed ? 'allowed' : 'denied';
                    const statusText = node.validation.allowed ? '✅ ALLOWED' : '❌ DENIED';
                    statusHtml = `<div class="node-status ${status}">${statusText}</div>`;
                    clickable = `onclick="showRulesModal('NSG', '${displayName}', ${JSON.stringify(node.validation).replace(/"/g, '&quot;')})" style="cursor: pointer;"`;
                }

                // Show Firewall rule status
                if (node.type === 'Azure Firewall' && node.ruleAllowed !== undefined) {
                    const status = node.ruleAllowed ? 'allowed' : 'denied';
                    const statusText = node.ruleAllowed ? '✅ ALLOWED' : '❌ DENIED';
                    statusHtml = `<div class="node-status ${status}">${statusText}</div>`;
                    clickable = `onclick="showRulesModal('Firewall', '${displayName}', ${JSON.stringify(node).replace(/"/g, '&quot;')})" style="cursor: pointer;"`;
                }

                const iconUrl = typeIcons[node.type];
                const iconSize = node.type === 'Destination' ? '80px' : '55px';
                const iconHtml = iconUrl && (iconUrl.startsWith('http') || iconUrl.startsWith('./'))
                    ? `<img src="${iconUrl}" alt="${node.type}" style="width: ${iconSize}; height: ${iconSize}; object-fit: contain; font-size: 50px; line-height: 1;">`
                    : `<span style="font-size: ${node.type === 'Destination' ? '60px' : '40px'};">${iconUrl || '?'}</span>`;

                html += `
                    <div class="path-node" ${clickable}>
                        <div class="node-icon ${typeColors[node.type] || 'node-next-hop'}">
                            ${iconHtml}
                        </div>
                        <div class="node-label">${displayName}</div>
                        <div class="node-type">${node.type}</div>
                        ${displayIp ? `<div class="node-ip">${displayIp}</div>` : ''}
                        ${statusHtml}
                    </div>
                `;

                if (idx < displayPath.length - 1 && node.type !== 'NSG Validation') {
                    html += '<div class="arrow">→</div>';
                }
            });

            html += '</div>';
            vizEl.innerHTML = html;
        }

        function renderPathTable(data) {
            const path = data.path || [];
            const tbody = document.querySelector('.path-table tbody');
            tbody.innerHTML = '';

            // Filter out "Next Hop Result" type nodes
            const displayPath = path.filter(node => node.type !== 'Next Hop Result');

            displayPath.forEach(node => {

                const tr = document.createElement('tr');
                const details = [];

                if (node.ip && node.type !== 'Destination') details.push(`IP: ${node.ip}`);
                if (node.type === 'Destination' && node.ip) details.push(`Destination: ${node.ip}`);
                if (node.nextHopIpAddress) details.push(`Next Hop IP: ${node.nextHopIpAddress}`);
                if (node.nextHopType) details.push(`Type: ${node.nextHopType}`);
                if (node.addressPrefix && node.type !== 'Virtual Network') details.push(`CIDR: ${node.addressPrefix}`);
                if (node.rulesCount !== undefined) details.push(`Rules: ${node.rulesCount}`);
                if (node.subnets !== undefined) details.push(`Subnets: ${node.subnets}`);
                if (node.sku) details.push(`SKU: ${node.sku}`);
                if (node.threatIntelMode) details.push(`Threat Intel: ${node.threatIntelMode}`);
                if (node.routesCount !== undefined) details.push(`Routes: ${node.routesCount}`);
                if (node.type === 'Virtual Network' && node.addressSpace) details.push(`Address Space: ${node.addressSpace.join(', ')}`);

                // Add NSG validation status if present
                if (node.type === 'Network Security Group' && node.validation) {
                    const statusText = node.validation.allowed ? '✅ ALLOWED' : '❌ DENIED';
                    details.push(`Status: ${statusText}`);
                    details.push(`Reason: ${node.validation.reason}`);
                }

                // Add Effective Route details
                if (node.type === 'Effective Route') {
                    if (node.addressPrefix) details.push(`CIDR: ${node.addressPrefix}`);
                    if (node.nextHopType) details.push(`Next Hop: ${node.nextHopType}`);
                    if (node.nextHopIpAddress) details.push(`Next Hop IP: ${node.nextHopIpAddress}`);
                }

                // Add Firewall Rule details
                if (node.type === 'Azure Firewall') {
                    if (node.sku) details.push(`SKU: ${node.sku}`);
                    if (node.threatIntelMode) details.push(`Threat Intel: ${node.threatIntelMode}`);
                    if (node.ruleAllowed !== undefined) {
                        const ruleStatus = node.ruleAllowed ? '✅ ALLOWED' : '❌ DENIED';
                        const ruleName = node.matchedRule ? `Rule: ${node.matchedRule}` : 'No matching rule';
                        details.push(`FW Status: ${ruleStatus} (${ruleName})`);
                    }
                }

                const displayName = node.name || (node.type === 'Destination' ? node.ip : 'N/A');

                tr.innerHTML = `
                    <td>${node.step}</td>
                    <td>${node.type}</td>
                    <td>${displayName}</td>
                    <td><code>${details.join(' | ') || 'N/A'}</code></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateInfo(data) {
            const meta = data.metadata || {};
            const sourceDisplay = meta.sourceVm
                ? `${meta.sourceIp}\n(${meta.sourceVm})`
                : meta.sourceIp || 'N/A';

            document.getElementById('info-source').innerHTML = sourceDisplay.split('\n').join('<br>');
            document.getElementById('info-dest').textContent = meta.destinationIp || 'N/A';

            const port = meta.destinationPort || 'N/A';
            const protocol = meta.protocol || 'N/A';
            document.getElementById('info-port').textContent = `${port}/${protocol}`;
        }

        function loadData(jsonData) {
            try {
                const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                const path = data.path || [];
                const displayPath = path.filter(node => node.type !== 'Next Hop Result');

                renderRoutingInfo(data, displayPath);
                renderVisualization(data);
                renderPathTable(data);
                updateInfo(data);
                showStatus('✅ Data loaded successfully!', 'success');
            } catch (err) {
                showStatus(`❌ Error loading data: ${err.message}`);
            }
        }

        // Initialize event listeners when DOM is ready
        function initializeEventListeners() {
            const traceBtn = document.getElementById('traceBtn');

            if (traceBtn) {
                traceBtn.addEventListener('click', async () => {
                    // 먼저 Azure 로그인 상태 확인
                    try {
                        const statusResponse = await fetch('http://localhost:3001/api/azure-status');
                        const status = await statusResponse.json();

                        if (!status.authenticated) {
                            const message = `
                                ⚠️ <strong>Azure 로그인 필요</strong><br><br>
                                PowerShell 터미널에서 다음 명령을 실행하세요:<br><br>
                                <code style="font-size: 16px; font-weight: bold; color: #fff; background: #000; padding: 12px; border-radius: 4px; display: block; margin: 10px 0;">az login</code>
                                <br>
                                로그인이 완료되면 Trace 버튼을 다시 클릭하세요!
                            `;
                            showStatus(message, 'error');
                            return;
                        }
                    } catch (err) {
                        showStatus(`로그인 상태 확인 실패: ${err.message}`, 'error');
                        return;
                    }

                    // 로그인 확인됨 - Trace 실행
                    const resourceGroup = document.getElementById('resourceGroup').value;
                    const vmName = document.getElementById('vmName').value;
                    const sourceIP = document.getElementById('sourceIP').value;
                    const destIP = document.getElementById('destIP').value;
                    const destPort = document.getElementById('destPort').value;
                    const protocol = document.getElementById('protocol').value;

                    if (!resourceGroup || !vmName || !sourceIP || !destIP || !destPort) {
                        showStatus('모든 필드를 입력해주세요', 'error');
                        return;
                    }

                    try {
                        showStatus('경로 추적 중입니다. 잠시만 기다려주세요...', 'success', true);
                        const response = await fetch('http://localhost:3001/api/trace-network', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                resourceGroup, vmName, sourceIP, destIP, destPort, protocol
                            })
                        });

                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error || '요청 실패');
                        }

                        const data = await response.json();
                        const path = data.path || [];
                        const displayPath = path.filter(node => node.type !== 'Next Hop Result');

                        renderRoutingInfo(data, displayPath);
                        renderVisualization(data);
                        renderPathTable(data);
                        updateInfo(data);
                        document.getElementById('status').innerHTML = '';
                        showStatus('✓ 경로 추적 완료!', 'success');
                    } catch (err) {
                        document.getElementById('status').innerHTML = '';
                        showStatus(`오류: ${err.message}`, 'error');
                    }
                });
            }
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeEventListeners);
        } else {
            initializeEventListeners();
        }

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        function updateTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
                          (!document.documentElement.getAttribute('data-theme') && prefersDark.matches);
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : current === 'light' ? '' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            updateTheme();
        });

        updateTheme();

        // Auto-load sample data if available (optional)
        // Commented out as we're using API now
    </script>
</body>
</html>
